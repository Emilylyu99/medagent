[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-grounded-healthcare-agent"
version = "0.1.0"
description = "A portfolio-ready multi-agent clinical evidence review demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
llm = [
  "openai>=2.0,<3.0",
]
ui = [
  "httpx>=0.27,<1.0",
  "streamlit>=1.39,<2.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
